stages:
  - build_and_push

variables:
  AWS_DEFAULT_REGION: us-east-2
  ECR_REGISTRY: 589535355002.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPO: 589535355002.dkr.ecr.us-east-2.amazonaws.com/careerops

build_and_push:
  stage: build_and_push
  image: docker:latest

  before_script:
    - apk add --no-cache aws-cli
    - aws --version
    - aws sts get-caller-identity
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  script:
    - docker buildx create --use
    - docker buildx build --platform linux/amd64 --provenance=false --push -t "$ECR_REPO:latest" -t "$ECR_REPO:$CI_COMMIT_SHORT_SHA" .

  only:
    - main